name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao no formato MAJOR.MINOR.PATCH (vazio incrementa o patch)'
        type: string
        required: false
      prerelease:
        description: 'Publicar como pre-release'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Validar segredos de assinatura
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Segredo $secret nao configurado no repositorio (ver docs/release.md)"
              exit 1
            fi
          done

      - name: Definir versao
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(scripts/bump-version.sh "$INPUT_VERSION")
          {
            echo "name=$version"
            echo "tag=v$version"
            echo "apk=build/outputs/apk/lawnWithQuickstep/release/AproLauncher-$version-release.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Verificar tag disponivel
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::A tag $TAG ja existe"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Configurar assinatura
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Gerar APK de release
        run: ./gradlew assembleLawnWithQuickstepRelease

      - name: Remover credenciais de assinatura
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/keystore.jks"

      - name: Publicar commit e tag da versao
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.properties
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME" --follow-tags

      - name: Atestar procedencia do APK
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.version.outputs.apk }}

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AproLauncher ${{ steps.version.outputs.name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.version.outputs.apk }}

      - name: Guardar mapping do R8
        uses: actions/upload-artifact@v6
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: build/outputs/mapping/lawnWithQuickstepRelease/mapping.txt
          if-no-files-found: warn
          retention-days: 90
