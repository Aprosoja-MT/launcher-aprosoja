name: Debug

on:
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk-debug:
    name: APK de debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Validar segredos de assinatura
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Segredo $secret nao configurado no repositorio (ver docs/release.md)"
              exit 1
            fi
          done

      - name: Definir versionCode de rebuild
        id: version
        env:
          RUN: ${{ github.run_number }}
        run: |
          build=$(( ((RUN - 1) % 99) + 1 ))
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Configurar assinatura
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Gerar APK de debug
        run: ./gradlew assembleLawnWithQuickstepDebug -PappVersionBuild=${{ steps.version.outputs.build }} -PappKeepApplicationId=true

      - name: Remover credenciais de assinatura
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/keystore.jks"

      - uses: actions/upload-artifact@v6
        with:
          name: aprolauncher-debug
          path: build/outputs/apk/lawnWithQuickstep/debug/*.apk
          if-no-files-found: error
          retention-days: 14
