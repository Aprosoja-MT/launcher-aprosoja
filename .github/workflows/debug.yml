name: Debug

on:
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk-debug:
    name: APK de debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Definir versionCode de rebuild
        id: version
        env:
          RUN: ${{ github.run_number }}
        run: |
          build=$(( ((RUN - 1) % 99) + 1 ))
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Gerar APK de debug
        run: ./gradlew assembleLawnWithQuickstepDebug -PappVersionBuild=${{ steps.version.outputs.build }}

      - uses: actions/upload-artifact@v6
        with:
          name: aprolauncher-debug
          path: build/outputs/apk/lawnWithQuickstep/debug/*.apk
          if-no-files-found: error
          retention-days: 14
