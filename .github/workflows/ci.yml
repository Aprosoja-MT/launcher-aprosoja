name: CI

on:
  push:
    branches:
      - aprolauncher-dev
    paths-ignore:
      - '.idea/**'
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE.txt'
  pull_request:
    branches:
      - aprolauncher-dev
    paths-ignore:
      - '.idea/**'
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE.txt'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  estilo:
    name: Estilo de codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew spotlessCheck
